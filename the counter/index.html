<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شمارنده ورزش</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:   radial-gradient(circle at 20% 20%, #8b0000 0%, transparent 35%),
    radial-gradient(circle at 80% 80%, #ff0000 0%, transparent 30%),
    linear-gradient(135deg, #000000 0%, #0d0d0d 45%, #300000 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 350px;
      background: #111;
      border: 2px solid #e00000;
      border-radius: 25px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.25);
    }

    h1 {
      color: #ff1a1a;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .exercise {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .counter {
      font-size: 80px;
      font-weight: bold;
      color: white;
      margin: 20px 0;
      text-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      width: 70px;
      height: 70px;
      border: none;
      border-radius: 50%;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .minus {
      background: #222;
      color: #ff3333;
      border: 2px solid #e00000;
    }

    .plus {
      background: #e00000;
      color: white;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
    }

    button:active {
      transform: scale(0.95);
    }

    .reset {
      margin-top: 25px;
      padding: 10px 25px;
      width: auto;
      height: auto;
      border-radius: 10px;
      background: transparent;
      color: #aaa;
      border: 1px solid #444;
      font-size: 15px;
    }

    .reset:hover {
      color: white;
      border-color: #e00000;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏋️ شمارنده ورزش</h1>

    <div class="exercise">تعداد حرکت</div>

    <div class="counter" id="counter">0</div>

    <div class="buttons">
      <button class="minus" onclick="decrease()">−</button>
      <button class="plus" onclick="increase()">+</button>
    </div>

    <button class="reset" onclick="resetCounter()">
      ریست کردن
    </button>

  </div>

  <script>
    let count = 0;

    const counter = document.getElementById("counter");

    function increase() {
      count++;
      counter.textContent = count;
    }

    function decrease() {
      if (count > 0) {
        count--;
        counter.textContent = count;
      }
    }

    function resetCounter() {
      count = 0;
      counter.textContent = count;
    }
  </script>

</body>
</html>
